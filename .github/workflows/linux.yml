name: Linux

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: 3code-linux-amd64
            ext: tar.gz
          - os: ubuntu-22.04-arm
            artifact: 3code-linux-arm64
            ext: tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          nimble install -y --depsOnly
          nimble setup -y
          echo '--path:"src"' >> nimble.paths

      - name: Compute build flags
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "BUILD_FLAGS=-d:autoUpdate" >> "$GITHUB_ENV"
          else
            echo "BUILD_FLAGS=-d:versionSuffix=-main-${GITHUB_SHA:0:8}" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: nimble build -y -d:release ${{ env.BUILD_FLAGS }}

      - name: Run tests
        run: nimble test
        timeout-minutes: 20

      - name: Package
        run: |
          mkdir -p ${{ matrix.artifact }}
          cp 3code ${{ matrix.artifact }}/
          cp README.md LICENSE ${{ matrix.artifact }}/
          VER=$(grep 'version\s*=' threecode.nimble | head -1 | sed 's/.*=\s*"\(.*\)".*/\1/')
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "$VER" > ${{ matrix.artifact }}/VERSION
          else
            echo "${VER}-main-${GITHUB_SHA:0:8}" > ${{ matrix.artifact }}/VERSION
          fi
          tar czf ${{ matrix.artifact }}.${{ matrix.ext }} ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.${{ matrix.ext }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: pages-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          commit="${{ github.sha }}"
          mkdir -p dl

          # Download our own artifacts first
          gh run download ${{ github.run_id }} --dir dl

          # Download sibling platform artifacts that have completed
          for workflow in Linux OSX Windows; do
            run_id=$(gh run list --workflow "$workflow" --branch main \
              --status success --event push --limit 20 \
              --json databaseId,headSha -q ".[] | select(.headSha==\"$commit\") | .databaseId" || true)
            if [ -n "$run_id" ] && [ "$run_id" != "${{ github.run_id }}" ]; then
              echo "$workflow: run $run_id — downloading"
              gh run download "$run_id" --dir dl
            fi
          done

          echo "--- artifacts ---"
          find dl -type f

      - name: Assemble site
        run: |
          mkdir -p site/main
          cp dl/3code-linux-amd64/3code-linux-amd64.tar.gz     site/main/ 2>/dev/null || true
          cp dl/3code-linux-arm64/3code-linux-arm64.tar.gz     site/main/ 2>/dev/null || true
          cp dl/3code-macos-universal/3code-macos-universal.tar.gz site/main/ 2>/dev/null || true
          cp dl/3code-windows-amd64/3code-windows-amd64.zip    site/main/ 2>/dev/null || true
          cat > site/index.html <<EOF
          <!doctype html><meta charset=utf-8><title>3code main builds</title>
          <h1>3code main builds</h1>
          <p>Per-commit builds from <code>main</code> (commit ${{ github.sha }}).</p>
          <ul>
          EOF
          for f in site/main/*; do
            [ -f "$f" ] || continue
            b=$(basename "$f")
            echo "            <li><a href=\"main/$b\">$b</a></li>" >> site/index.html
          done
          cat >> site/index.html <<EOF
          </ul>
          EOF

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

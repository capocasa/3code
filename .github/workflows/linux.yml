name: Linux

on:
  push:
    branches: [main]
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Architecture to build'
        type: choice
        options: [amd64, arm64, both]
        default: amd64

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # On workflow_dispatch the caller picks one arch to skip the slow
        # ARM64 runner; every other trigger builds both.
        config: ${{ (github.event_name != 'workflow_dispatch' || inputs.arch == 'both') && fromJson('[{"arch":"amd64","os":"ubuntu-22.04","artifact":"3code-linux-amd64"},{"arch":"arm64","os":"ubuntu-22.04-arm","artifact":"3code-linux-arm64"}]') || fromJson(format('[{{"arch":"{0}","os":"{1}","artifact":"3code-linux-{0}"}}]', inputs.arch, inputs.arch == 'arm64' && 'ubuntu-22.04-arm' || 'ubuntu-22.04')) }}

    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: nimble install -y --depsOnly

      - name: Compute build flags
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            # autoupdate on releases only
            echo "BUILD_FLAGS=-d:autoUpdate" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: nimble build -y -d:release ${{ env.BUILD_FLAGS }}

      - name: Run tests
        run: nimble test
        timeout-minutes: 20

      - name: Package
        run: |
          mkdir -p ${{ matrix.config.artifact }}
          cp 3code ${{ matrix.config.artifact }}/
          cp README.md LICENSE ${{ matrix.config.artifact }}/
          tar czf ${{ matrix.config.artifact }}.tar.gz ${{ matrix.config.artifact }}

      - name: Upload artifact (GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config.artifact }}
          path: ${{ matrix.config.artifact }}.tar.gz

      - name: Upload artifact to 3code.capocasa.dev
        if: github.ref == 'refs/heads/main'
        run: |
          curl -f -H "Authorization: Bearer ${{ secrets.RELEASE_SECRET }}" -F "file=@${{ matrix.config.artifact }}.tar.gz" \
            https://3code.capocasa.dev/main/upload.nim

name: Linux

on:
  push:
    branches: [main]
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Architecture to build'
        type: choice
        options: [amd64, arm64, both]
        default: amd64

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Default (push/tag/PR): both arches. On workflow_dispatch, the
        # caller picks one to skip the slow ARM64 runner.
        arch: ${{ (github.event_name != 'workflow_dispatch' || inputs.arch == 'both') && fromJson('["amd64","arm64"]') || fromJson(format('["{0}"]', inputs.arch)) }}
        include:
          - arch: amd64
            os: ubuntu-22.04
            artifact: 3code-linux-amd64
          - arch: arm64
            os: ubuntu-22.04-arm
            artifact: 3code-linux-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: nimble install -y --depsOnly

      - name: Compute build flags
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            # autoupdate on releases only
            echo "BUILD_FLAGS=-d:autoUpdate" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: nimble build -y -d:release ${{ env.BUILD_FLAGS }}

      - name: Run tests
        run: nimble test
        timeout-minutes: 20

      - name: Package
        run: |
          mkdir -p ${{ matrix.artifact }}
          cp 3code ${{ matrix.artifact }}/
          cp README.md LICENSE ${{ matrix.artifact }}/
          tar czf ${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}

      - name: Upload artifact (GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

      - name: Upload artifact to 3code.capocasa.dev
        if: github.ref == 'refs/heads/main'
        run: |
          curl -f -H "Authorization: Bearer ${{ secrets.RELEASE_SECRET }}" -F "file=@${{ matrix.artifact }}.tar.gz" \
            https://3code.capocasa.dev/main/upload.nim

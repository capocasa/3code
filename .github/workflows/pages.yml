name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - '*.nimble'
      - 'config.nims'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Wait for platform builds and download artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          commit="${{ github.sha }}"
          mkdir -p dl

          for workflow in Linux OSX Windows; do
            echo "--- $workflow ---"
            for i in $(seq 1 30); do
              # Fail fast: if this workflow already failed for this commit,
              # stop immediately instead of waiting for the timeout.
              failed=$(gh run list --workflow "$workflow" --branch main \
                --status failure --event push --limit 20 \
                --json databaseId,headSha -q ".[] | select(.headSha==\"$commit\") | .databaseId" 2>/dev/null)
              if [ -n "$failed" ]; then
                echo "  $workflow run $failed FAILED — aborting" >&2
                exit 1
              fi

              run_id=$(gh run list --workflow "$workflow" --branch main \
                --status success --event push --limit 20 \
                --json databaseId,headSha -q ".[] | select(.headSha==\"$commit\") | .databaseId" 2>/dev/null)
              if [ -n "$run_id" ]; then
                echo "  found run $run_id"
                gh run download "$run_id" --dir dl
                break
              fi
              echo "  attempt $i/30, sleeping 20s..."
              sleep 20
            done
            if [ -z "$run_id" ]; then
              echo "  ERROR: $workflow did not complete for $commit after 10min" >&2
              exit 1
            fi
          done

          echo "--- artifacts ---"
          find dl -type f

      - name: Assemble site
        run: |
          mkdir -p site/main
          cp dl/3code-linux-amd64/3code-linux-amd64.tar.gz     site/main/ 2>/dev/null || true
          cp dl/3code-linux-arm64/3code-linux-arm64.tar.gz     site/main/ 2>/dev/null || true
          cp dl/3code-macos-universal/3code-macos-universal.tar.gz site/main/ 2>/dev/null || true
          cp dl/3code-windows-amd64/3code-windows-amd64.zip    site/main/ 2>/dev/null || true
          cat > site/index.html <<EOF
          <!doctype html><meta charset=utf-8><title>3code main builds</title>
          <h1>3code main builds</h1>
          <p>Per-commit builds from <code>main</code> (commit ${{ github.sha }}).</p>
          <ul>
          EOF
          for f in site/main/*; do
            [ -f "$f" ] || continue
            b=$(basename "$f")
            echo "            <li><a href=\"main/$b\">$b</a></li>" >> site/index.html
          done
          cat >> site/index.html <<EOF
          </ul>
          EOF

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

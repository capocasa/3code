name: Pages

# Deploys to GitHub Pages incrementally: fires whenever Linux, OSX, or Windows
# completes on main. Each run gathers whatever platform artifacts are ready
# for the triggering commit and deploys. The site populates progressively as
# platforms finish — no polling, no waiting for all three.

on:
  workflow_run:
    workflows: [Linux, OSX, Windows]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    # Only deploy on success. The workflow_run trigger fires for all
    # conclusions (success, failure, cancelled); skip non-success so a
    # single broken platform doesn't blank the site.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            commit="${{ github.sha }}"
          else
            commit="${{ github.event.workflow_run.head_sha }}"
          fi
          mkdir -p dl

          for workflow in Linux OSX Windows; do
            run_id=$(gh run list --workflow "$workflow" --branch main \
              --status success --event push --limit 20 \
              --json databaseId,headSha -q ".[] | select(.headSha==\"$commit\") | .databaseId" || true)
            if [ -n "$run_id" ]; then
              echo "$workflow: run $run_id — downloading"
              gh run download "$run_id" --dir dl
            else
              echo "$workflow: no successful run yet for $commit, skipping"
            fi
          done

          echo "--- artifacts ---"
          find dl -type f

      - name: Assemble site
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            commit="${{ github.sha }}"
          else
            commit="${{ github.event.workflow_run.head_sha }}"
          fi
          mkdir -p site/main
          cp dl/3code-linux-amd64/3code-linux-amd64.tar.gz     site/main/ 2>/dev/null || true
          cp dl/3code-linux-arm64/3code-linux-arm64.tar.gz     site/main/ 2>/dev/null || true
          cp dl/3code-macos-universal/3code-macos-universal.tar.gz site/main/ 2>/dev/null || true
          cp dl/3code-windows-amd64/3code-windows-amd64.zip    site/main/ 2>/dev/null || true
          cat > site/index.html <<EOF
          <!doctype html><meta charset=utf-8><title>3code main builds</title>
          <h1>3code main builds</h1>
          <p>Per-commit builds from <code>main</code> (commit $commit).</p>
          <ul>
          EOF
          for f in site/main/*; do
            [ -f "$f" ] || continue
            b=$(basename "$f")
            echo "            <li><a href=\"main/$b\">$b</a></li>" >> site/index.html
          done
          cat >> site/index.html <<EOF
          </ul>
          EOF

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

name: OSX
on:
  workflow_dispatch:
    inputs:
      run-tests:
        description: 'Run the test suite (turn off to validate packaging alone)'
        type: boolean
        default: true
  push:
    branches: [main]
    tags: ['[0-9]+.[0-9]+.[0-9]+']

jobs:
  build:
    # Pinned label (macos-latest rolls to new macOS releases); the image
    # still receives weekly tool updates under the label, recorded in the
    # artifact's BUILD_INFO.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Pin Xcode toolchain
        # macos-15 keeps several Xcodes around and can switch the default
        # between image rolls; a default switch would silently recompile
        # both binary slices with a different clang. Select an explicit
        # version (the long-staying image default); if a future image
        # drops it this fails loudly instead of drifting. Must run before
        # setup-nim: on macOS the action builds Nim from source, and the
        # bootstrap compile uses this clang too.
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version
          xcodebuild -version | grep -qx 'Xcode 16.4' || { echo "Xcode 16.4 not selected" >&2; exit 1; }
          cc --version | head -1

      - name: Restore Nim toolchain cache
        id: cache-nim
        uses: actions/cache@v4
        with:
          path: /Users/runner/nim-toolchain
          # Version-first and hash-free (see linux-arm64.yml): never a
          # prefix of a legacy hashed key, no restore-keys.
          key: nim-toolchain-2.2.12-${{ runner.os }}-${{ runner.arch }}

      - uses: jiro4989/setup-nim-action@v2
        if: steps.cache-nim.outputs.cache-hit != 'true'
        with:
          # Exact version, not `stable`: the same commit must compile with
          # the same compiler forever. Bump deliberately, together with
          # regenerating nimble.lock (its `nim` entry records the version).
          nim-version: 2.2.12
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          parent-nim-install-directory: $HOME
          nim-install-directory: nim-toolchain

      - name: Add Nim to PATH on cache hit
        if: steps.cache-nim.outputs.cache-hit == 'true'
        run: echo "$HOME/nim-toolchain/bin" >> $GITHUB_PATH

      - name: Install dependencies
        # nimble.lock pins every dependency to an exact revision + checksum;
        # install honors it, so rebuilds of the same commit get identical
        # dependency trees (bump requires -> `nimble lock` to update).
        run: |
          nimble install -y --depsOnly

      - name: Build static OpenSSL (latest 3.5 LTS, both slices)
        # OpenSSL is linked into the binary (-d:staticSsl in config.nims),
        # replacing the Homebrew dylibs the tarball used to bundle - the
        # dylib dance caused #53 (relocation broke the signature, macOS 26
        # SIGKILLs the loader) and #56, and the bottle was arm64-only, so
        # Intel users had no usable libs at all. A static copy is frozen
        # at build time, so instead of pinning one version forever the
        # script resolves the newest 3.5.x release and verifies the
        # tarball's PGP signature; the series and key fingerprint are the
        # conscious-bump pins. Both slices build from one verified source
        # download (~4 min each on the 3-core runner).
        run: |
          sh tests/tools/fetch_openssl.sh 3.5 darwin64-arm64
          sh tests/tools/fetch_openssl.sh 3.5 darwin64-x86_64

      - name: Compute build flags
        # POSIX sh, not bash: the linux jobs run the same step under a
        # container's `sh -e`, where [[ ]] silently fails the condition
        # and releases build without -d:autoUpdate (issue #49). Keep the
        # step identical across platforms so it can't drift back.
        run: |
          case "${GITHUB_REF}" in
            refs/tags/*)
              # autoupdate on releases only
              echo "BUILD_FLAGS=-d:autoUpdate" >> "$GITHUB_ENV" ;;
          esac

      - name: Build
        run: |
          case "${GITHUB_REF}" in
            refs/tags/*) [ -n "${BUILD_FLAGS:-}" ] || {
              echo "BUILD_FLAGS empty on a tag build" >&2; exit 1; } ;;
          esac
          OPENSSL_STATIC=$PWD/openssl-static/darwin64-arm64 nimble build -y -d:release -d:staticSsl ${{ env.BUILD_FLAGS }}

      - uses: actions/setup-java@v4
        # The sandbox matrix runs javac/java under the seatbelt profile
        # (#66). The macos image USED to ship Temurin JDKs; it no longer
        # does (/usr/bin/javac is a stub that prints "Unable to locate a
        # Java Runtime"), so the JDK is pinned here like the other
        # toolchains instead of trusting image contents.
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify sandbox matrix (seatbelt + wall proxy)
        # End-to-end enforcement check of the shipped binary, mirroring
        # the manual stefani VM verification: the wall proxy fences
        # egress behind an allowlist, the box subprocess applies the
        # Seatbelt profile, and the policy's path denies punch through.
        run: |
          set -e
          BIN="$PWD/3code"
          SB="$(mktemp -d)/sb"
          mkdir -p "$SB/subdir"
          cd "$SB"
          fail() { echo "SANDBOX MATRIX FAIL: $1" >&2; exit 1; }

          # 1. fenced network: allowlist proxy lets google.com through
          printf 'allow\ndeny ./subdir\nallow *\ndeny 1.1.1.1\n' > .sandbox
          "$BIN" wall proxy --policy .sandbox --port 0 > /tmp/wallport.txt 2>&1 &
          sleep 2
          PORT=$(awk '{print $2}' /tmp/wallport.txt)
          [ -n "$PORT" ] || fail "wall proxy did not start"
          export WALL_PROXY_PORT="$PORT"
          export http_proxy="http://127.0.0.1:$PORT" https_proxy="http://127.0.0.1:$PORT"

          code=$("$BIN" sandbox --policy .sandbox restrict -- curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://www.google.com) \
            || fail "curl google.com through the wall proxy"
          [ "$code" = 200 ] || fail "google.com expected 200, got $code"

          # 2. denied host: the proxy must refuse 1.1.1.1. For a plain
          # http:// URL the 403 arrives as a regular response, so curl
          # exits 0; only the status code tells the deny.
          out=$("$BIN" sandbox --policy .sandbox restrict -- curl -sS -o /dev/null -w '%{http_code}' --max-time 20 http://1.1.1.1) \
            || fail "curl 1.1.1.1 through the wall proxy errored"
          [ "$out" = 403 ] || fail "1.1.1.1 expected 403, got $out"

          # 3. writable root: bash write into the project dir works
          "$BIN" sandbox --policy .sandbox restrict -- sh -c 'echo hi > ok.txt' \
            || fail "write to the project root was denied"
          [ "$(cat ok.txt)" = hi ] || fail "project-root write produced wrong content"

          # 4. denied subdir: bash write under ./subdir must fail
          if "$BIN" sandbox --policy .sandbox restrict -- sh -c 'echo bad > subdir/bad.txt' 2>/dev/null; then
            fail "write into ./subdir was allowed"
          fi
          [ ! -e subdir/bad.txt ] || fail "./subdir/bad.txt exists despite the deny"

          kill %1 2>/dev/null || true
          unset http_proxy https_proxy

          # 5. open network: a policy without host rules must not block
          # sockets (the (deny default) baseline covers network-* too;
          # regression check for the bare (allow network-*) fix)
          printf 'allow\ndeny ./subdir\n' > .sandbox
          code=$("$BIN" sandbox --policy .sandbox restrict -- curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://www.google.com) \
            || fail "open-network curl google.com"
          [ "$code" = 200 ] || fail "open-network google.com expected 200, got $code"

          # 6. JVM under the seatbelt profile (issue #66): java needs
          # operations no path rule can reach - the kernel classifies the
          # JVM's kern.grade_cputype startup read as a sysctl-write, and
          # its getpwuid user lookup goes through opendirectoryd's mach
          # service. Both ride the sandwall profile, so a plain policy
          # with zero java-specific rules must compile and run hello
          # world (JDK from the setup-java step above).
          command -v javac >/dev/null || fail "macos image no longer ships javac"
          # printf, not a heredoc: a column-1 heredoc body (or its
          # terminator) breaks out of the YAML block scalar and
          # invalidates the whole workflow file - push runs then fail
          # "workflow file issue" and workflow_dispatch 422s (exactly
          # what run 38571243045 showed until this fix).
          printf '%s\n' \
            'public class Hello {' \
            '  public static void main(String[] args) {' \
            '    System.out.println("jvm-ok");' \
            '  }' \
            '}' > Hello.java
          javac -version || fail "javac broken outside the sandbox"
          # The JDK grant is toolchain-location bookkeeping, not a
          # java-specific sandbox rule: the #66 profile work (sysctl,
          # opendirectoryd) is unconditional. Exec follows the readable
          # set, and setup-java's JDK lives under hostedtoolcache,
          # outside the baseline (/usr, /Library, ...); a dev mac with
          # java under /Library needs no grant.
          # Bare `allow` = the project dir writable (the JVM needs cwd
          # readable to bootstrap user.dir).
          printf 'allow\nreadonly %s\n' "$JAVA_HOME" > .sandbox-java
          "$BIN" sandbox --policy .sandbox-java restrict -- javac Hello.java \
            || fail "javac under the sandbox"
          out=$("$BIN" sandbox --policy .sandbox-java restrict -- java Hello) \
            || fail "java under the sandbox"
          [ "$out" = "jvm-ok" ] || fail "sandboxed java printed '$out'"

          echo "sandbox matrix: all checks passed"

      - name: Generate nimble.paths for direct nim invocations
        # Placed after the arm64 slice's `nimble build`: extra --path
        # switches change module symbol naming, so the release slice keeps
        # the exact path set nimble passes. See the comment in windows.yml
        # for what this file is for.
        run: |
          { echo '--noNimblePath'
            for d in "$HOME"/.nimble/pkgs2/*/; do echo "--path:\"$d\""; done
          } > nimble.paths
          cat nimble.paths

      - name: Build x86_64 and create universal binary
        env:
          SLICE_DIR: ${{ runner.temp }}
        run: |
          mv 3code "$SLICE_DIR/3code-arm64"
          rm -rf ~/.cache/nim/threecode_r
          OPENSSL_STATIC=$PWD/openssl-static/darwin64-x86_64 nim c -d:release -d:staticSsl ${{ env.BUILD_FLAGS }} --passC:"-arch x86_64" --passL:"-arch x86_64" --cpu:amd64 -o:"$SLICE_DIR/3code-x86_64" src/threecode.nim
          # Sign each thin slice BEFORE lipo: codesign cannot grow a
          # slice that lacks a signature once it is embedded in a fat
          # archive (it fails the re-sign with ESRCH and verify reports
          # an invalid signature). ld already ad-hoc signs arm64; signing
          # both here also covers the x86_64 slice, which ld never signs.
          codesign --force --sign - "$SLICE_DIR/3code-arm64"
          codesign --force --sign - "$SLICE_DIR/3code-x86_64"
          # The fat binary must stay outside the workspace: the next step
          # (Run tests) rebuilds ./3code natively via ci_tests.sh ->
          # build_binary.sh, and a fat binary parked at ./3code gets silently
          # replaced by that arm64 rebuild before Package copies it. That is
          # how 0.8.0 shipped an arm64-only "universal" tarball.
          lipo -create "$SLICE_DIR/3code-arm64" "$SLICE_DIR/3code-x86_64" -output "$SLICE_DIR/3code-universal"
          file "$SLICE_DIR/3code-universal"
          lipo -archs "$SLICE_DIR/3code-universal" | grep -qw arm64   || { echo "missing arm64 slice" >&2; exit 1; }
          lipo -archs "$SLICE_DIR/3code-universal" | grep -qw x86_64 || { echo "missing x86_64 slice" >&2; exit 1; }

      - name: Run tests
        # tests/tools/ci_tests.sh wraps testament: log file instead of a pipe (a
        # single hung test used to stall the pipe and hide everything after
        # it), a watchdog that bounds the run and attributes any hang to the
        # exact test binary, and a propagated exit code. Categories run in
        # parallel via `testament all`; the tty PTY tests get the runner to
        # themselves because each category is still sequential inside
        # testament. If load-induced tty flakes reappear on this 3-core
        # runner, pass explicit categories to serialize them.
        # Dispatch-only bypass: tty timing tests are marginal on the 3-core
        # macos-15 runner; run-tests=false validates build+packaging alone.
        # 2400s, not 1800: the tty category runs alone after the parallel
        # categories, and green runs measured 1763s of the old 1800s cap
        # (Oct 6); a slow runner tips it over and the timeout, not a test,
        # fails the job.
        if: github.event_name != 'workflow_dispatch' || inputs.run-tests
        # OPENSSL_STATIC + THREECODE_TEST_NIMFLAGS make the test-rebuilt
        # 3code binary statically linked too, so spawned test children
        # need no dylibs and TLS works against the stub provider.
        env:
          OPENSSL_STATIC: ${{ github.workspace }}/openssl-static/darwin64-arm64
          THREECODE_TEST_NIMFLAGS: -d:staticSsl
        run: sh tests/tools/ci_tests.sh 2400
        timeout-minutes: 45

      - name: Package
        # Deterministic archive: entry order from a sorted list, mtimes
        # anchored to the commit (SOURCE_DATE_EPOCH), owner normalized,
        # gzip without name/timestamp. Python tarfile, not bsdtar: the
        # runner's bsdtar rejects --mtime on create, and its failure inside
        # the find|sort|bsdtar|gzip pipeline is masked by gzip's success
        # (the step shell is bash -e, no pipefail), which shipped an empty
        # tarball that still passed the h1==h2 double-pack check. Python
        # writes every field explicitly and the member-count guard below
        # catches any empty archive. OpenSSL is statically linked into
        # the binary (no dylibs bundled since the fetch_openssl.sh step).
        shell: bash
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          mkdir -p 3code-macos-universal
          cp "$RUNNER_TEMP/3code-universal" 3code-macos-universal/3code
          cp README.md LICENSE 3code-macos-universal/
          # Both slices were ad-hoc signed before lipo (see the slice
          # build step); macOS 26+ kills unsigned code at exec (issue
          # #56). Verify the fat file if codesign accepts it, else each
          # thin slice: lipo -thin copies slice bytes unchanged, and
          # per-slice validity is what the kernel enforces at exec.
          # (codesign --verify on some lipo outputs reports "No such
          # process"; the verbose dump is kept in the log for diagnosis.)
          codesign -dv --verbose=2 3code-macos-universal/3code 2>&1 || true
          if ! codesign --verify --strict --verbose=2 \
              3code-macos-universal/3code 2>&1; then
            echo "fat-file verify failed; verifying slices" >&2
            lipo 3code-macos-universal/3code -thin arm64 -output /tmp/3code.arm64
            lipo 3code-macos-universal/3code -thin x86_64 -output /tmp/3code.x86_64
            codesign --verify --strict /tmp/3code.arm64 \
              || { echo "invalid code signature (arm64 slice)" >&2; exit 1; }
            codesign --verify --strict /tmp/3code.x86_64 \
              || { echo "invalid code signature (x86_64 slice)" >&2; exit 1; }
          fi
          # Capture the version from the built binary so it can be checked
          # without running the binary on its target OS (its native arm64
          # slice does run here).
          ./3code-macos-universal/3code -v > 3code-macos-universal/VERSION
          # Pinned by checksum: cacert.pem is a mutable URL, so an upstream
          # refresh must be a conscious pin bump, not silent drift.
          CACERT_SHA256=a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors \
            https://curl.se/ca/cacert.pem -o 3code-macos-universal/cacert.pem
          echo "${CACERT_SHA256}  3code-macos-universal/cacert.pem" | shasum -a 256 -c -
          {
            nim --version | head -1
            cc --version | head -1
            echo "openssl $(cat openssl-static/version) source-built"
            shasum -a 256 3code-macos-universal/3code | cut -d' ' -f1
            echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
          } > 3code-macos-universal/BUILD_INFO
          cat > /tmp/mktar.py <<'PY'
          import gzip, os, sys, tarfile
          src, out, epoch = sys.argv[1], sys.argv[2], int(sys.argv[3])
          names = sorted(
              os.path.join(r, n).replace(os.sep, "/")
              for r, ds, fs in os.walk(src)
              for n in ds + fs)
          # GzipFile with filename='' and mtime=0: no name, no timestamp
          with open(out, "wb") as raw, \
              gzip.GzipFile(filename="", mode="wb", fileobj=raw, mtime=0) as gz, \
              tarfile.open(fileobj=gz, mode="w") as t:
              for n in names:
                  ti = t.gettarinfo(n)
                  ti.mtime = epoch
                  ti.uid = ti.gid = 0
                  ti.uname = ti.gname = ""
                  if ti.isfile():
                      t.addfile(ti, open(n, "rb"))
                  else:
                      t.addfile(ti)
          PY
          pack() { python3 /tmp/mktar.py 3code-macos-universal 3code-macos-universal.tar.gz "$SOURCE_DATE_EPOCH"; }
          pack
          h1=$(shasum -a 256 3code-macos-universal.tar.gz | cut -d' ' -f1)
          # files-only layout, like the windows zip: 6 members
          # (3code BUILD_INFO cacert.pem LICENSE README.md VERSION)
          members=$(tar -tzf 3code-macos-universal.tar.gz | wc -l)
          [ "$members" -ge 6 ] || { echo "archive has only $members members" >&2; exit 1; }
          find 3code-macos-universal ! -type l -exec touch {} +  # perturb mtimes (not symlinks: touch would create dangling targets)
          pack
          h2=$(shasum -a 256 3code-macos-universal.tar.gz | cut -d' ' -f1)
          [ "$h1" = "$h2" ] || { echo "archive not reproducible: $h1 vs $h2" >&2; exit 1; }

      - name: Upload artifact (GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: 3code-macos-universal
          path: 3code-macos-universal.tar.gz

      - name: Upload artifact to 3code.capocasa.dev
        if: github.ref == 'refs/heads/main'
        run: |
          # --retry: 5xx is transient on the upload endpoint
          curl -f --retry 5 --retry-delay 5 -H "Authorization: Bearer ${{ secrets.RELEASE_SECRET }}" -F "file=@3code-macos-universal.tar.gz" \
            https://3code.capocasa.dev/main/builds/upload.nim

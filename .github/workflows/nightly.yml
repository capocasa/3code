name: Soak

# The per-change suite leaves the four tty stress tests out (287s together,
# 35% of the tty run). They guard real races, so they run here on the
# full suite, by hand only (workflow_dispatch, e.g. before a release);
# nothing is scheduled. The suite is
# sharded like linux-amd64.yml (CORE_SHARD and TTY_SHARD i/n, one job per
# shard, SOAK=1 adds the stress tests to the tty shards): the serial run
# took 20 min in one job, the slowest shard takes a third of that.

on:
  workflow_dispatch:

jobs:
  soak:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: core-1
            tty_shard: none
            core_shard: 1/3
          - suite: core-2
            tty_shard: none
            core_shard: 2/3
          - suite: core-3
            tty_shard: none
            core_shard: 3/3
          - suite: tty-1
            tty_shard: 1/3
          - suite: tty-2
            tty_shard: 2/3
          - suite: tty-3
            tty_shard: 3/3
    name: soak (${{ matrix.suite }})
    env:
      SOAK: '1'
      TTY_SHARD: ${{ matrix.tty_shard }}
      CORE_SHARD: ${{ matrix.core_shard }}
    steps:
      - uses: actions/checkout@v4

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 2.4.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          parent-nim-install-directory: $HOME
          nim-install-directory: nim-toolchain

      - name: Install dependencies
        run: nimble install -y --depsOnly

      - name: Generate nimble.paths for direct nim invocations
        run: |
          { echo '--noNimblePath'
            for d in "$HOME"/.nimble/pkgs2/*/; do echo "--path:\"$d\""; done
          } > nimble.paths
          cat nimble.paths

      - name: Run tests (shard including the soak tier)
        # 1500s per shard: the soak tier adds 287s to the tty half, spread
        # over the three tty shards; 35 min keeps 2x headroom.
        run: sh tests/tools/ci_tests.sh 1500
        timeout-minutes: 35

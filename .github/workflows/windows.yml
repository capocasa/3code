name: Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['[0-9]+.[0-9]+.[0-9]+']

jobs:
  build:
    # Pinned label (windows-latest rolls to new Server releases); the
    # image still receives tool updates under the label, recorded in the
    # artifact's BUILD_INFO.
    runs-on: windows-2025

    # git-bash on the Windows runner. The Windows default (pwsh) does not
    # propagate non-zero exit codes from native exes like nimble, so a failed
    # build/test is swallowed and the job runs on into packaging, which then
    # fails for a misleading reason (missing artifact). Same workaround as
    # release.yml.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned C toolchain
        # nim's Windows zip ships no C compiler, so the binary is compiled
        # by whatever gcc is first on PATH — and the image's tool versions
        # float with weekly image rolls. Use the same mingw64.7z Nim's own
        # Windows CI uses (winlibs GCC 11.1.0, unchanged on that URL since
        # 2021), pinned by sha256 like dlls.zip above: an upstream refresh
        # must be a conscious bump. Extracted outside the checkout because
        # config.nims embeds `git status --porcelain` in the version
        # define — an untracked toolchain dir would mark every build
        # "-unstaged".
        run: |
          MINGW64_SHA256=04a535d1e0880364ca9609713744f1a9a36835c4ced834cf435c4dc4eca2159a
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o "$RUNNER_TEMP/mingw64.7z" \
            https://nim-lang.org/download/mingw64.7z
          echo "${MINGW64_SHA256}  $RUNNER_TEMP/mingw64.7z" | sha256sum -c -
          7z x -y -o"$RUNNER_TEMP/mingw" "$RUNNER_TEMP/mingw64.7z" > /dev/null
          echo "$RUNNER_TEMP/mingw/mingw64/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/mingw/mingw64/bin/gcc" --version | head -1

      - uses: jiro4989/setup-nim-action@v2
        with:
          # Exact version, not `stable`: the same commit must compile with
          # the same compiler forever. Bump deliberately, together with
          # regenerating nimble.lock (its `nim` entry records the version).
          nim-version: 2.2.12
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          parent-nim-install-directory: $HOME
          nim-install-directory: nim-toolchain

      - name: Install dependencies
        # nimble.lock pins every dependency to an exact revision + checksum;
        # install honors it, so rebuilds of the same commit get identical
        # dependency trees (bump requires -> `nimble lock` to update).
        run: |
          nimble install -y --depsOnly

      - name: Build static OpenSSL (latest 3.5 LTS)
        # OpenSSL is linked into the exe (-d:staticSsl in config.nims),
        # replacing the bundled DLLs the package used to ship - those were
        # OpenSSL 1.1, end-of-life since 2023, and the dlopen design also
        # broke the sandbox relay (LoadLibrary as the sandwall user,
        # 0xC0000142). A static copy is frozen at build time, so instead
        # of pinning one version forever the script resolves the newest
        # 3.5.x release and verifies the tarball's PGP signature; the
        # series and key fingerprint are the conscious-bump pins.
        #
        # Runs under the image's real MSYS2: git-bash ships a gutted perl
        # without the core modules openssl's Configure needs, so pacman
        # installs perl/make/gpg into C:\msys64. PATH order keeps the
        # pinned mingw gcc first so Configure compiles with the same
        # toolchain nim uses. OPENSSL_STATIC is exported in native form
        # (D:/...): nim and the linker are Windows binaries.
        run: |
          MINGW_BIN="$(cygpath -u "$RUNNER_TEMP")/mingw/mingw64/bin"
          # One msys2 bash for everything. msys2's usr/bin goes FIRST so
          # the pacman-installed perl/make win over git-bash's gutted
          # perl (msys2 ships neither until installed; pacman itself is
          # not on the inherited PATH, only at its absolute location),
          # with the pinned mingw after it: msys2 has no gcc, so Configure
          # still compiles with nim's toolchain. gpgv is pointed at
          # git-bash's via the GPGV env override (both local gpg
          # --import paths are unusable: msys2's exits 2 silently,
          # git-bash's hangs under msys2 bash). pacman's install-info
          # hook can exit 2 on a fresh prefix, so its exit is not
          # trusted; the command -v checks gate the tools the script
          # needs.
          /c/msys64/usr/bin/bash -c "
            set -x
            export PATH='/c/msys64/usr/bin:$MINGW_BIN:'\$PATH
            export GPGV='/c/Program Files/Git/usr/bin/gpgv'
            pacman -Sy --noconfirm perl make || true
            command -v perl make
            bash -x tests/tools/fetch_openssl.sh 3.5 mingw64"
          echo "OPENSSL_STATIC=$(cygpath -m "$PWD/openssl-static/mingw64")" >> "$GITHUB_ENV"
          echo "THREECODE_TEST_NIMFLAGS=-d:staticSsl" >> "$GITHUB_ENV"
        # Bounds a stalled openssl build (msys2 make can wedge on the
        # jobserver); without it the job default is 360m.
        timeout-minutes: 90

      - name: Compute build flags
        # POSIX sh: runners and containers differ in the default step
        # shell; [[ ]] fails the condition silently under `sh -e` and
        # releases build without -d:autoUpdate (issue #49).
        run: |
          case "${GITHUB_REF}" in
            refs/tags/*)
              # releases: release build + autoupdate
              echo "BUILD_FLAGS=-d:release -d:autoUpdate" >> "$GITHUB_ENV" ;;
            *)
              # branch builds exist for testing: same fast debug config as
              # the local Windows repro loop (AGENTS.md), so what CI ships
              # for probing is what was probed locally
              echo "BUILD_FLAGS=--opt:none --debugger:native" >> "$GITHUB_ENV" ;;
          esac

      - name: Build
        run: |
          # Both Compute branches set BUILD_FLAGS; empty here means the
          # Compute step silently failed and the release would ship
          # without auto-update (issue #49).
          [ -n "${BUILD_FLAGS:-}" ] || {
            echo "BUILD_FLAGS empty" >&2; exit 1; }
          OPENSSL_STATIC=$(cygpath -m "$PWD/openssl-static/mingw64") nimble build -y -d:staticSsl ${{ env.BUILD_FLAGS }}

      - name: Generate nimble.paths for direct nim invocations
        # nim disables its pkgs2 package scan whenever a nimble.lock is
        # present (compiler/nim.nim: nimbleLockExists -> disableNimblePath;
        # the lock means nimble passes explicit --path flags, so nim assumes
        # nothing else needs the scan). Direct `nim c` and testament
        # compiles then fail with "cannot open file: <dep>" — main-branch CI
        # only works because it has no committed lock. nimble.paths
        # (gitignored, included by config.nims) restores exactly the paths
        # the disabled scan would have used: one --path per installed
        # package root. Generated after `nimble build` so the main binary's
        # path set stays the one nimble passes.
        run: |
          # cygpath -m: git-bash's $HOME is the MSYS form (/c/...), which
          # the Windows-native nim.exe cannot resolve. Glob in MSYS form,
          # emit each path as C:/... (native, forward slashes).
          { echo '--noNimblePath'
            for d in "$HOME"/.nimble/pkgs2/*/; do echo "--path:\"$(cygpath -m "$d")\""; done
          } > nimble.paths
          cat nimble.paths

      - name: Stage cacert.pem for tests
        # The statically linked OpenSSL has no default cert store on stock
        # Windows, so the tty tests' local-TLS stub provider path needs
        # SSL_CERT_FILE pointed at a bundle. Same pinned cacert.pem the
        # package ships (curl.se, mutable URL: pinned by sha256 so an
        # upstream refresh is a conscious bump, not silent drift).
        run: |
          CACERT_SHA256=a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors \
            https://curl.se/ca/cacert.pem -o cacert.pem
          echo "${CACERT_SHA256}  cacert.pem" | sha256sum -c -
          mkdir -p build && cp cacert.pem build/
          echo "SSL_CERT_FILE=$PWD/cacert.pem" >> "$GITHUB_ENV"

      - name: Package (Windows) - single exe, no DLLs
        # OpenSSL is compiled into 3code.exe (static archives from the
        # fetch_openssl.sh step), so the zip carries no libssl/libcrypto
        # DLLs anymore; only the exe, docs, and the CA bundle ship.
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          mkdir -p 3code-windows-amd64
          cp 3code.exe 3code-windows-amd64/
          cp README.md LICENSE 3code-windows-amd64/
          cp cacert.pem 3code-windows-amd64/
          # Capture the version from the staged binary so it can be checked
          # without running the binary on its target OS.
          ./3code-windows-amd64/3code.exe -v > 3code-windows-amd64/VERSION
          # Toolchain provenance: answers "same toolchain?" when comparing
          # two builds later. gcc is the pinned mingw64.7z from the first
          # step, so the line is stable across image rolls.
          {
            nim --version | head -1
            gcc --version | head -1
            echo "openssl $(cat openssl-static/version) source-built (mingw64)"
            sha256sum 3code.exe | cut -d' ' -f1
            echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
          } > 3code-windows-amd64/BUILD_INFO
          # Deterministic zip: Compress-Archive embeds wall-clock mtimes,
          # and bsdtar's zip writer stores atime/ctime in the UT extra
          # field (ctime cannot be set in userspace). Python's zipfile
          # writes exactly what we tell it: fixed date, sorted names,
          # normalized modes.
          cat > /tmp/mkzip.py <<'PY'
          import os, sys, zipfile
          from datetime import datetime, timezone
          src, out, epoch = sys.argv[1], sys.argv[2], int(sys.argv[3])
          dt = datetime.fromtimestamp(epoch, timezone.utc).timetuple()[:6]
          names = sorted(
              os.path.join(r, n).replace(os.sep, "/")
              for r, ds, fs in os.walk(src)
              for n in ds + fs)
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
              for n in names:
                  zi = zipfile.ZipInfo(n, dt)
                  zi.external_attr = (os.stat(n).st_mode & 0xFFFF) << 16
                  z.writestr(zi, open(n, "rb").read())
          PY
          pack() { python /tmp/mkzip.py 3code-windows-amd64 3code-windows-amd64.zip "$SOURCE_DATE_EPOCH"; }
          pack
          h1=$(sha256sum 3code-windows-amd64.zip | cut -d' ' -f1)
          find 3code-windows-amd64 ! -type l -exec touch {} +  # perturb mtimes (not symlinks: touch would create dangling targets)
          pack
          h2=$(sha256sum 3code-windows-amd64.zip | cut -d' ' -f1)
          [ "$h1" = "$h2" ] || { echo "archive not reproducible: $h1 vs $h2" >&2; exit 1; }

      - name: Build stub binary for tty tests
        # The tty tests spawn the 3code stub binary (built -d:providerStub)
        # as their child. Build it once here so every test reuses the same
        # binary instead of each test triggering a full rebuild.
        run: |
          OPENSSL_STATIC=$(cygpath -m "$PWD/openssl-static/mingw64") nim c -d:staticSsl -d:providerStub --threads:on --path:src -o:build/3code_stub.exe src/threecode.nim

      - name: Run tests
        # Runs AFTER Package on purpose: ci_tests.sh rebuilds the workspace
        # 3code.exe without BUILD_FLAGS, and Package used to copy that
        # rebuild, shipping releases with auto-update dead (issue #49).
        # Run the tty category via tests/tools/ci_tests.sh: log file instead of a
        # pipe so a hung test cannot mask the rest, watchdog bounds the run
        # and names the hung binary, exit code propagated. Tests that hang
        # or fail under ConPTY are disabled with `disabled: "win"` in their
        # discard blocks (see test_tty_functional, test_spinner_race_stress,
        # test_429_typing_during_backoff, test_interrupt_prestream_freeze,
        # test_interrupt_network_connect, test_resize_ticker,
        # test_broken_stdout_exit). The remaining tests pass on Windows.
        run: |
          # Smoke-check: the statically linked 3code binary starts
          # standalone (no DLLs anywhere near it).
          ./3code.exe -v || { echo "3code.exe failed to start"; exit 1; }
          OPENSSL_STATIC=$(cygpath -m "$PWD/openssl-static/mingw64") sh tests/tools/ci_tests.sh 900 tty
        timeout-minutes: 20

      - name: Upload artifact (GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: 3code-windows-amd64
          path: 3code-windows-amd64.zip

      - name: Upload artifact to 3code.capocasa.dev
        if: github.ref == 'refs/heads/main'
        run: |
          # --retry: 5xx is transient on the upload endpoint
          curl -f --retry 5 --retry-delay 5 -H "Authorization: Bearer ${{ secrets.RELEASE_SECRET }}" -F "file=@3code-windows-amd64.zip" \
            https://3code.capocasa.dev/main/builds/upload.nim

